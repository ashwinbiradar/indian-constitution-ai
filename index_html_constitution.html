<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Constitution AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            padding: 2rem;
            max-width: 900px;
            margin: auto;
        }
        input, button {
            padding: 0.5rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        #search {
            width: 100%;
            margin-bottom: 1rem;
        }
        article {
            background-color: white;
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        article h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>Indian Constitution AI</h1>
    <p>Explore all Articles & Clauses of the Indian Constitution</p>
</header>

<div class="container">
    <input type="text" id="search" placeholder="Search Articles or Keywords...">

    <div id="articles"></div>
</div>

<script>
    // Sample Constitution Data (replace or expand as needed)
    const constitution = [
        { article: "Article 1", title: "Name and territory of the Union", text: "India, that is Bharat, shall be a Union of States." },
        { article: "Article 2", title: "Admission or establishment of new States", text: "Parliament may by law admit into the Union, or establish, new States." },
        { article: "Article 3", title: "Formation of new States and alteration of areas", text: "Parliament may form a new State by separation of territory..." },
        { article: "Article 4", title: "Laws made under Articles 2 and 3", text: "Laws under Articles 2 and 3 shall provide for the amendment of the First and Fourth Schedule..." }
        // You can continue adding all Articles up to 395 or use a JSON file
    ];

    const container = document.getElementById("articles");
    const searchInput = document.getElementById("search");

    function renderArticles(filter = "") {
        container.innerHTML = "";
        const filtered = constitution.filter(c => 
            c.article.toLowerCase().includes(filter.toLowerCase()) ||
            c.title.toLowerCase().includes(filter.toLowerCase()) ||
            c.text.toLowerCase().includes(filter.toLowerCase())
        );

        filtered.forEach(c => {
            const art = document.createElement("article");
            art.innerHTML = `<h3>${c.article}: ${c.title}</h3><p>${c.text}</p>`;
            container.appendChild(art);
        });

        if (filtered.length === 0) {
            container.innerHTML = "<p>No matching articles found.</p>";
        }
    }

    searchInput.addEventListener("input", () => {
        renderArticles(searchInput.value);
    });

    renderArticles();
</script>

</body>
</html>
